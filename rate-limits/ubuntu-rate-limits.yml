specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Ubuntu
providerId: ubuntu
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Linux
  - Package Management
  - Open Source
  - Rate Limiting
description: Canonical does not publish per-second numeric rate limits for the Ubuntu Pro Contracts API,
  Livepatch API, or related services on its public terms / pricing pages. Operational throttling exists
  at the CDN / edge but is not documented as a fixed quota for end users.
notes: No public per-API rate-limit numbers were found on canonical.com or ubuntu.com. Reconciled remains
  false until a numeric source can be verified.
sources:
  - https://canonical.com/legal/terms
  - https://ubuntu.com/pricing/pro
limits:
  - name: Ubuntu Pro / Livepatch Service
    scope: account
    metric: varies
    limit: see Canonical service docs
    notes: Specific request-rate ceilings are not published; access is gated by machine token / contract
      token rather than a public per-second quota.
policies:
  - name: Token-Scoped Access
    description: Ubuntu Pro Contracts and Livepatch APIs are accessed via per-machine tokens issued at
      attach time; throttling, when it occurs, is per-token at the edge.
  - name: Backoff
    description: Apply exponential backoff with jitter on transient errors; no specific Retry-After timing
      is documented publicly.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
