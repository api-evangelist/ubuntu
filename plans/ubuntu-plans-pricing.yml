description: Ubuntu Pro is Canonical's commercial subscription overlay on top of Ubuntu LTS. Pricing
  is published per-machine per-year, with separate Workstation (desktop) and Server tiers, optional 24/7
  support add-ons, and a free Personal/Community track. Coverage distinguishes infra-only (Main archive,
  4,700+ packages) from full-stack (Main + Universe, 36,000+ packages).
sources:
  - https://ubuntu.com/pricing/pro
  - https://ubuntu.com/pro/subscribe
plans:
  - id: ubuntu-pro-personal
    name: Ubuntu Pro for Personal Use
    type: freemium
    description: Free Ubuntu Pro for individual / community use. Up to 5 machines for personal use; up
      to 50 machines for active Ubuntu community members.
    entries:
      - label: Personal Machines
        name: personal_machines
        type: quota
        metric: machine
        limit: 5
        timeFrame: year
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Community Machines
        name: community_machines
        type: quota
        metric: machine
        limit: 50
        timeFrame: year
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Ubuntu Pro Subscription
      - name: Expanded Security Maintenance
      - name: Livepatch
      - name: Personal / Community Use Only
  - id: ubuntu-pro-workstation
    name: Ubuntu Pro Desktop / Workstation
    type: subscription
    description: Per-workstation Ubuntu Pro subscription for desktop and workstation deployments.
    entries:
      - label: Workstation (Base)
        name: workstation_base
        type: subscription
        metric: machine
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: '$25 per machine per year'
        userMultiplied: false
      - label: Workstation with 24/7 Enterprise Support
        name: workstation_enterprise_support
        type: subscription
        metric: machine
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: '$300 per machine per year'
        userMultiplied: false
    elements:
      - name: Ubuntu Pro Subscription
      - name: Expanded Security Maintenance
      - name: Livepatch
      - name: Knowledge Base Access (with support add-on)
      - name: Ubuntu Assurance Program (with support add-on)
  - id: ubuntu-pro-server
    name: Ubuntu Pro Server
    type: subscription
    description: Per-physical-machine Ubuntu Pro subscription for server deployments. Each physical machine
      covers unlimited VMs running on it. Optional 24/7 infrastructure or full-stack support tiers.
    entries:
      - label: Server (Base, Unlimited VMs)
        name: server_base
        type: subscription
        metric: machine
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: '$500 per machine per year'
        userMultiplied: false
      - label: Server with 24/7 Infrastructure Support
        name: server_infra_support
        type: subscription
        metric: machine
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: '$1,775 per machine per year'
        userMultiplied: false
      - label: Server with 24/7 Full Support
        name: server_full_support
        type: subscription
        metric: machine
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: '$3,400 per machine per year'
        userMultiplied: false
    elements:
      - name: Ubuntu Pro Subscription (Main + Universe)
      - name: Expanded Security Maintenance
      - name: Livepatch
      - name: Unlimited VMs per Physical Machine
      - name: Knowledge Base Access (with support add-on)
      - name: Ubuntu Assurance Program (with support add-on)
