      - Distributions
      - Packages
      - Projects
      - Open Source
    serviceName: Launchpad API
    serviceCategory: API
  - name: Ubuntu Pro API
    baseURL: https://contracts.canonical.com/
    tags:
      - Enterprise
      - Security
      - Subscriptions
      - Support
    serviceName: Ubuntu Pro API
    serviceCategory: API
  - name: Snap Store API
    baseURL: https://api.snapcraft.io
    tags:
