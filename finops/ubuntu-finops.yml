specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Ubuntu
providerId: ubuntu
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Linux
  - Open Source
  - Security
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Ubuntu Pro: per-machine annual subscription with a free Personal/Community
  track, separate Workstation and Server tiers, and optional 24/7 support add-ons.'
sources:
  - https://ubuntu.com/pricing/pro
  - https://ubuntu.com/pro/subscribe
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Canonical Ltd
serviceCategory: Operating System / Security Maintenance
billingModel:
  pricingCategory: Subscription (Per-Machine)
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Ubuntu Pro
  ServiceCategory: Operating System / Security Maintenance
  ProviderName: Ubuntu
  PublisherName: Canonical Ltd
  InvoiceIssuerName: Canonical Ltd
  BillingCurrency: USD
meters:
  - name: workstation_subscription
    description: Annual Ubuntu Pro subscription per workstation
    unit: machine
    aggregation: sum
    dimensions:
      - support_tier
  - name: server_subscription
    description: Annual Ubuntu Pro subscription per physical server (unlimited VMs per host)
    unit: machine
    aggregation: sum
    dimensions:
      - support_tier
  - name: support_add_on
    description: 24/7 infrastructure or full-stack support uplift
    unit: machine
    aggregation: sum
    dimensions:
      - support_tier
principles:
  - name: Visibility
    description: Track machines under Ubuntu Pro via the Pro Contracts API and the Ubuntu Pro dashboard;
      reconcile against Canonical's annual invoices.
  - name: Allocation
    description: Tag each pro-attached machine with team / environment so per-machine subscriptions can
      be charged back to the workload owner.
  - name: Optimization
    description: Move dev / staging fleets to the free Personal track where eligible; consolidate VMs
      onto Pro-licensed physical hosts to amortize the per-machine fee; right-size support tier (Base
      vs Infra vs Full).
  - name: Accountability
    description: Platform / infrastructure owners review attached-machine count vs entitlement before
      annual renewal.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
