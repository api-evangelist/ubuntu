openapi: 3.2.0
info:
  title: Snap Store Devices Metrics API
  description: The Snap Store Devices API provides access to the Canonical Snap Store for querying, discovering, and managing snap packages. Supports snap search, info retrieval, refresh operations, category listings, and metrics for IoT and desktop deployments.
  version: '104'
  contact:
    name: Snapcraft Community
    url: https://forum.snapcraft.io
servers:
- url: https://api.snapcraft.io
  description: Snap Store Production API
tags:
- name: Metrics
  description: Snap usage metrics
paths:
  /v2/metrics:
    get:
      operationId: getSnapMetrics
      summary: Get Snap Metrics
      description: Returns usage and install metrics for snaps.
      tags:
      - Metrics
      parameters:
      - name: snap_name
        in: query
        required: false
        schema:
          type: string
        description: Filter metrics by snap name.
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Start date for metrics range.
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date
        description: End date for metrics range.
      responses:
        '200':
          description: Snap metrics data.
          content:
            application/json:
              schema:
                type: object
