naftiko: 1.0.0-alpha2
info:
  label: Snap Store Devices API — Info
  description: 'Snap Store Devices API — Info. 1 operations. Lead operation: Get Snap Info. Self-contained Naftiko capability
    covering one Ubuntu business surface.'
  tags:
  - Ubuntu
  - Info
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UBUNTU_API_KEY: UBUNTU_API_KEY
capability:
  consumes:
  - type: http
    namespace: snap-store-info
    baseUri: https://api.snapcraft.io
    description: Snap Store Devices API — Info business capability. Self-contained, no shared references.
    resources:
    - name: v2-snaps-info-snap_name
      path: /v2/snaps/info/{snap_name}
      operations:
      - name: getsnapinfo
        method: GET
        description: Get Snap Info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: snap_name
          in: path
          type: string
          description: The snap package name.
          required: true
        - name: fields
          in: query
          type: string
          description: Comma-separated list of fields to return.
        - name: Snap-Device-Series
          in: header
          type: string
          description: Snap device series identifier.
          required: true
  exposes:
  - type: rest
    namespace: snap-store-info-rest
    port: 8080
    description: REST adapter for Snap Store Devices API — Info. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v2/snaps/info/{snap-name}
      name: v2-snaps-info-snap-name
      description: REST surface for v2-snaps-info-snap_name.
      operations:
      - method: GET
        name: getsnapinfo
        description: Get Snap Info
        call: snap-store-info.getsnapinfo
        with:
          snap_name: rest.snap_name
          fields: rest.fields
          Snap-Device-Series: rest.Snap-Device-Series
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: snap-store-info-mcp
    port: 9090
    transport: http
    description: MCP adapter for Snap Store Devices API — Info. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-snap-info
      description: Get Snap Info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: snap-store-info.getsnapinfo
      with:
        snap_name: tools.snap_name
        fields: tools.fields
        Snap-Device-Series: tools.Snap-Device-Series
      outputParameters:
      - type: object
        mapping: $.
