naftiko: "1.0.0-alpha1"

info:
  label: "Snap Store API"
  description: "API for searching, discovering, and managing snap packages in the Canonical Snap Store."
  tags:
    - Ubuntu
    - Snap
    - Package Management
    - Canonical
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys: {}

capability:
  consumes:
    - type: http
      namespace: snap-store
      baseUri: https://api.snapcraft.io
      description: "Snap Store Devices API for snap discovery and management."
      resources:
        - name: snap-search
          path: /v2/snaps/search
          description: "Search for snaps in the Snap Store."
          operations:
            - name: search-snaps
              method: GET
              description: "Search for snaps by name, keyword, or category."
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: false
                  description: "Search query string."
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Filter by snap category."
                - name: Snap-Device-Series
                  in: header
                  type: string
                  required: true
                  description: "Snap device series (default: 16)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: snap-info
          path: /v2/snaps/info/{snap_name}
          description: "Detailed information about a specific snap."
          operations:
            - name: get-snap-info
              method: GET
              description: "Get detailed information about a snap and its released revisions."
              inputParameters:
                - name: snap_name
                  in: path
                  type: string
                  required: true
                  description: "The snap package name."
                - name: Snap-Device-Series
                  in: header
                  type: string
                  required: true
                  description: "Snap device series (default: 16)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: snap-categories
          path: /v2/snaps/categories
          description: "Available snap categories."
          operations:
            - name: list-snap-categories
              method: GET
              description: "Returns all available snap categories in the store."
              inputParameters:
                - name: Snap-Device-Series
                  in: header
                  type: string
                  required: true
                  description: "Snap device series (default: 16)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
