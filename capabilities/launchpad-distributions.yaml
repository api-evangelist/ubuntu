naftiko: 1.0.0-alpha2
info:
  label: Launchpad REST API — Distributions
  description: 'Launchpad REST API — Distributions. 1 operations. Lead operation: Get Ubuntu Distribution. Self-contained
    Naftiko capability covering one Ubuntu business surface.'
  tags:
  - Ubuntu
  - Distributions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UBUNTU_API_KEY: UBUNTU_API_KEY
capability:
  consumes:
  - type: http
    namespace: launchpad-distributions
    baseUri: https://api.launchpad.net/1.0
    description: Launchpad REST API — Distributions business capability. Self-contained, no shared references.
    resources:
    - name: ubuntu
      path: /ubuntu
      operations:
      - name: getubuntudistribution
        method: GET
        description: Get Ubuntu Distribution
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: launchpad-distributions-rest
    port: 8080
    description: REST adapter for Launchpad REST API — Distributions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/ubuntu
      name: ubuntu
      description: REST surface for ubuntu.
      operations:
      - method: GET
        name: getubuntudistribution
        description: Get Ubuntu Distribution
        call: launchpad-distributions.getubuntudistribution
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: launchpad-distributions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Launchpad REST API — Distributions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-ubuntu-distribution
      description: Get Ubuntu Distribution
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: launchpad-distributions.getubuntudistribution
      outputParameters:
      - type: object
        mapping: $.
