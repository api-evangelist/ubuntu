naftiko: 1.0.0-alpha2
info:
  label: Snap Store Devices API — Categories
  description: 'Snap Store Devices API — Categories. 1 operations. Lead operation: List Snap Categories. Self-contained Naftiko
    capability covering one Ubuntu business surface.'
  tags:
  - Ubuntu
  - Categories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UBUNTU_API_KEY: UBUNTU_API_KEY
capability:
  consumes:
  - type: http
    namespace: snap-store-categories
    baseUri: https://api.snapcraft.io
    description: Snap Store Devices API — Categories business capability. Self-contained, no shared references.
    resources:
    - name: v2-snaps-categories
      path: /v2/snaps/categories
      operations:
      - name: listsnapcategories
        method: GET
        description: List Snap Categories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Snap-Device-Series
          in: header
          type: string
          description: Snap device series identifier.
          required: true
  exposes:
  - type: rest
    namespace: snap-store-categories-rest
    port: 8080
    description: REST adapter for Snap Store Devices API — Categories. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v2/snaps/categories
      name: v2-snaps-categories
      description: REST surface for v2-snaps-categories.
      operations:
      - method: GET
        name: listsnapcategories
        description: List Snap Categories
        call: snap-store-categories.listsnapcategories
        with:
          Snap-Device-Series: rest.Snap-Device-Series
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: snap-store-categories-mcp
    port: 9090
    transport: http
    description: MCP adapter for Snap Store Devices API — Categories. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-snap-categories
      description: List Snap Categories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: snap-store-categories.listsnapcategories
      with:
        Snap-Device-Series: tools.Snap-Device-Series
      outputParameters:
      - type: object
        mapping: $.
